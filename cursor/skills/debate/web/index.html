<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Code Debate — Live</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="header">
    <h1>Code Debate</h1>
    <div class="meta">
      <span id="targetLabel">—</span>
      <span class="sep">·</span>
      <span id="elapsedLabel">0s</span>
    </div>
  </header>

  <section class="chips" id="summaryChips"></section>

  <nav class="timeline" id="phaseTimeline" aria-label="Debate phases"></nav>

  <section class="agents" id="agentSection">
    <h2>Agents</h2>
    <div id="agentCards" class="agent-cards"></div>
  </section>

  <section class="logs" id="logSection">
    <h2>Raw logs</h2>
    <p class="hint">Tails update while agents run. Expand a file to view.</p>
    <div id="logAccordions"></div>
  </section>

  <section class="report" id="reportSection" hidden>
    <h2>Report preview</h2>
    <pre id="reportPre" class="report-pre"></pre>
  </section>

  <footer class="footer">
    <span id="pollStatus">Connecting…</span>
  </footer>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
